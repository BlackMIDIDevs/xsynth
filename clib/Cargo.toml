[package]
name = "xsynth-clib"
description = "C/C++ bindings for XSynth"
authors = ["MBMS"]
readme = "README.md"
publish = false

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "xsynth"
