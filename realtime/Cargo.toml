[package]
name = "xsynth-realtime"
description = "A real-time MIDI synthesizer using XSynth."
authors = ["Arduano", "MBMS", "Kaydax", "Khangaroo"]
readme = "README.md"

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bytemuck = "1.25.2"
cpal = { version = "0.18.2", features = ["pipewire"] }
crossbeam-channel = "0.5.17"
lazy_static = "1.5.1"
rayon = "1.12.0"
spin_sleep = "1.3.3"
xsynth-core = { workspace = true }
serde = { version = "1.0", optional = true, features = ["derive"] }
thiserror = "2.0.21"

[features]
serde = ["dep:serde", "xsynth-core/serde"]

[dev-dependencies]
midi-toolkit-rs = "0.3.1"
